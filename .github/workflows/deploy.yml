# GENERATO da Sites/tools/sync.mjs (fonte: tools/deploy.yml): non modificare a mano.
name: Deploy Quartz site to GitHub Pages
 
on:
  push:
    branches:
      - v5
 
permissions:
  contents: read
  pages: write
  id-token: write
 
concurrency:
  group: "pages"
  cancel-in-progress: false
 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Fetch all history for git info
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Cache Quartz plugins
        uses: actions/cache@v6
        with:
          path: .quartz/plugins
          key: ${{ runner.os }}-plugins-${{ hashFiles('quartz.lock.json') }}
      - name: Install Dependencies
        run: npm ci
      - name: Install Quartz plugins
        run: |
          # Il tema comune si reinstalla sempre dal lockfile: niente versioni vecchie dalla cache
          rm -rf .quartz/plugins/site-header .quartz/plugins/course-meta .quartz/plugins/footer
          npx quartz plugin install
      - name: Build Quartz
        run: npx quartz build
      - name: Redirect dei vecchi URL (redirects.txt)
        run: |
          if [ -f redirects.txt ]; then
            while read -r from to; do
              case "$from" in ''|'#'*) continue ;; esac
              mkdir -p "public/$(dirname "$from")"
              printf '<!DOCTYPE html><html lang="it"><head><meta charset="utf-8"><title>Pagina spostata</title><link rel="canonical" href="%s"><meta name="robots" content="noindex"><meta http-equiv="refresh" content="0; url=%s"></head></html>\n' "$to" "$to" > "public/$from.html"
            done < redirects.txt
          fi
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public
 
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
